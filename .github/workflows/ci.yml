name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Codebase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: determinate-systems/nix-installer-action@v22

      - name: Magic Nix Cache
        uses: determinate-systems/magic-nix-cache-action@v14

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-

      - name: Install Dependencies
        run: nix develop --command npm ci

      - name: Run Linter
        run: nix develop --command npm run lint

      - name: Run Type Check
        run: |
          nix develop --command npx nuxi prepare
          nix develop --command npx vue-tsc --noEmit

      - name: Run Tests
        run: nix develop --command npm test -- --run
