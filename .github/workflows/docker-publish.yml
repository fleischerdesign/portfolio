name: Build, Push, and Deploy Docker Image

on:
  push:
    branches: ["master"]
  repository_dispatch:
    types: [content_update]
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          flavor: minimal
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build Docker image with Nix
        run: |
          nix build .#dockerImage --out-link result
          docker load < result

      - name: Set image tag
        run: |
          IMAGE_TAG=$(date +%Y%m%d)-$(git rev-parse --short HEAD)
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Tag image
        run: |
          docker tag portfolio:latest ghcr.io/${{ github.repository }}:latest
          docker tag portfolio:latest ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: |
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
